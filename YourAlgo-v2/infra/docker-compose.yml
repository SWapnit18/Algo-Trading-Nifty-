services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: youralgo
      MYSQL_USER: youralgo
      MYSQL_PASSWORD: youralgo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql_data:
